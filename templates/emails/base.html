<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F3F4F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #111827; }
    .wrapper { max-width: 600px; margin: 32px auto; background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .header { background: #16A34A; padding: 32px 40px; text-align: center; }
    .header h1 { color: #FFFFFF; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .header p  { color: #BBF7D0; font-size: 13px; margin-top: 4px; }
    .body { padding: 40px; }
    .body h2 { font-size: 20px; color: #111827; margin-bottom: 12px; }
    .body p  { font-size: 15px; color: #374151; line-height: 1.7; margin-bottom: 16px; }
    .detail-box { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 20px; margin: 24px 0; }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #E5E7EB; font-size: 14px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #6B7280; font-weight: 600; }
    .detail-value { color: #111827; text-align: right; }
    .btn { display: inline-block; background: #16A34A; color: #FFFFFF !important; padding: 14px 32px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 15px; margin: 8px 0; }
    .btn-secondary { background: #FFFFFF; color: #16A34A !important; border: 2px solid #16A34A; }
    .divider { border: none; border-top: 1px solid #E5E7EB; margin: 24px 0; }
    .footer { background: #F9FAFB; padding: 24px 40px; text-align: center; border-top: 1px solid #E5E7EB; }
    .footer p { font-size: 12px; color: #9CA3AF; line-height: 1.6; }
    .footer a { color: #16A34A; text-decoration: none; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge-green  { background: #DCFCE7; color: #15803D; }
    .badge-red    { background: #FEE2E2; color: #DC2626; }
    .badge-yellow { background: #FEF9C3; color: #92400E; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>KARIBU</h1>
      <p>karibu.co.ke · Your Event Platform</p>
    </div>
    <div class="body">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>
        This email was sent by Karibu Platform.<br>
        &copy; {{ year }} Karibu. All rights reserved.<br>
        <a href="{{ frontend_url }}">karibu.co.ke</a> &middot;
        <a href="{{ frontend_url }}/support">Support</a>
      </p>
    </div>
  </div>
</body>
</html>
